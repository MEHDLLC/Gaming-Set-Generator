name: Render STLs

on:
  push:
    # branches must be listed explicitly: defining only `tags` would
    # stop branch pushes from triggering at all.
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - "src/**"
      - "config/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/render.yml"
  workflow_dispatch:

# A new push supersedes any in-flight render of the same ref.
concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSCAD and xvfb
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openscad xvfb

      - name: Render, validate, and describe all kits
        run: python3 scripts/build.py

      - name: Package kit bundles
        run: |
          mkdir -p dist
          cd generated
          for d in */ ; do
            [ "$d" = ".fit/" ] && continue
            zip -qr "../dist/${d%/}.zip" "$d"
          done
          ls -la ../dist/

      - name: Upload rendered outputs
        uses: actions/upload-artifact@v4
        with:
          name: stl-bundle
          path: |
            generated/
            !generated/.fit/**

      - name: Upload kit zips
        uses: actions/upload-artifact@v4
        with:
          name: kit-zips
          path: dist/

      - name: Commit generated files back to branch
        if: startsWith(github.ref, 'refs/heads/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/
          if ! git diff --cached --quiet; then
            git commit -m "CI: regenerate STL + txt outputs [skip ci]"
            # If the branch advanced while we rendered, skip: the newer
            # push triggers its own render of the newer sources.
            git push || echo "branch advanced; skipping commit-back"
          fi

      - name: Publish release with kit bundles (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
